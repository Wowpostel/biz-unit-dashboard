services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erpevv
      POSTGRES_USER: erpevv
      POSTGRES_PASSWORD: erpevv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpevv -d erpevv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://erpevv:erpevv@db:5432/erpevv
      JWT_SECRET: ${JWT_SECRET:-erpevv-dev-secret-change-me}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-true}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
      - "8080:80"

volumes:
  pgdata:
  uploads:
