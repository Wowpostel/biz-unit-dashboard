services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: erpevv
      POSTGRES_USER: erpevv
      POSTGRES_PASSWORD: erpevv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpevv -d erpevv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://erpevv:erpevv@db:5432/erpevv
      JWT_SECRET: ${JWT_SECRET:-erpevv-dev-secret-change-me}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
